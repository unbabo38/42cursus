server {
    listen 8080;
    server_name localhost;

    # 1. / は GET リクエストのみを許可
    location / {
        allow_methods GET;
        root ./docs; # あなたの環境のデフォルトルート
        index index.html;
    }

    # 2. /directory/ は GET のみ、rootは YoupiBanane、indexは youpi.bad_extension
    location /directory {
        allow_methods GET;
        root ./YoupiBanane; # ※テスターの指示通りに作ったディレクトリへのパス
        index youpi.bad_extension;
    }

    # 3. /post_body は POST のみ、最大ボディサイズは 100 バイト
    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    # 4. 拡張子 .bla は POST のみ、cgi_test 実行ファイルを呼び出す
    # (Locationのパース方法が前方一致か拡張子一致かによって、ここの書き方は調整してください)
    location /directory/ {
		method GET POST;             # ⭕ GETもPOSTも両方許可する
		root ./YoupiBanane/;         # ⭕ 正しいルートパス
		index youpi.bad_extension;
		client_max_body_size 100000000;

		# 🎯 あなたの構文ルールに従って .bla と cgi_test を紐付ける！
		cgi_path .bla ./cgi_tester;    # ※ cgi_testのパスは環境に合わせて調整してください
	}
}
